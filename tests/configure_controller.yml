---
- name: Playbook to configure ansible Controller post installation
  hosts: localhost
  connection: local
  vars:
    controller_validate_certs: false
    controller_configuration_secure_logging: false
  # Define following vars here, or in configs/controller_auth.yml
  # controller_hostname: controller.example.com
  # controller_username: admin
  # controller_password: changeme
  collections:
    - awx.awx
    - infra.controller_configuration

  pre_tasks:

    - name: "Determine collection (block)"
      block:
        - name: "Check if the collection ansible.controller is installed"
          ansible.builtin.set_fact:
            ansible_controller_collection_installed: "{{ lookup('ansible.builtin.pipe', 'ansible-galaxy collection list | grep -i ansible.controller || echo NOTINSTALLED') }}"
          failed_when: ansible_controller_collection_installed is match('NOTINSTALLED')
      rescue:
        - name: "Check if the collection awx.awx is installed"
          ansible.builtin.set_fact:
            awx_awx_collection_installed: "{{ lookup('ansible.builtin.pipe', 'ansible-galaxy collection list | grep -i awx.awx || echo NOTINSTALLED') }}"
          failed_when: awx_awx_collection_installed is match('NOTINSTALLED')
      always:
        - name: "Set the collection providing the controller_api lookup plugin"
          ansible.builtin.set_fact:
            controller_api_plugin: "{{ ('ansible.controller.controller_api' if ansible_controller_collection_installed is defined) | default('awx.awx.controller_api' if awx_awx_collection_installed is defined) | default('NONE') }}"
        - name: "Fail if no collection is detected"
          ansible.builtin.fail:
            msg: "One of the following collections is required to be installed: 'ansible.controller' or 'awx.awx'."
          when: controller_api_plugin is match('NONE')
        - name: "Show the plugin we are using"
          ansible.builtin.debug:
            msg: "Using the 'controller_api' plugin from: {{ controller_api_plugin }}"

    - name: Include vars from configs directory
      ansible.builtin.include_vars:
        dir: ./configs
        ignore_files: [controller_config.yml.template]
        extensions: ["yml"]
      tags:
        - always

    - name: Wait for Controller to come up
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/v2/ping/"
        status_code: 200
        validate_certs: "{{ controller_validate_certs }}"
      register: result
      until: result.status == 200
      retries: 10
      delay: 30
      ignore_errors: true

    - name: Wait for the controller node to be up
      ansible.builtin.uri:
        url: "https://{{ controller_hostname }}/api/v2/mesh_visualizer/"
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        method: GET
        validate_certs: false
        force_basic_auth: true
        status_code: 200
        body_format: json
      register: mesh_data
      until: mesh_data.json is defined
      retries: 80
      delay: 5

    - name: "Show result of mesh_visualizer"
      ansible.builtin.debug:
        var: mesh_data

    - name: Sleep for 60 seconds and allow awx to come up.
      ansible.builtin.wait_for:
        timeout: 60
      delegate_to: localhost

  roles:
    - dispatch  # The dispatch role calls all of the other roles.

  tasks:

    - name: Validate that object_diff extra query parameters can only narrow its scope
      block:
        - name: Accept extra query parameters that narrow the diff
          ansible.builtin.include_role:
            name: object_diff
            tasks_from: query_params.yml
          vars:
            controller_configuration_object_diff_query_params:
              labels__name: casc-managed
              name__startswith: Demo

        - name: Reject extra query parameters that would replace the role's scope
          ansible.builtin.include_tasks: tasks/object_diff_query_params_conflict.yml
          loop:
            - {organization: 999}
            - {inventory: 999}
            - {managed: true}
            - {managed_by_tower: true}
            - {or__organization: 999}
            - {not__inventory: 999}
            - {organization__in: '1,999'}
            - {chain__or__inventory__name: Other}
            - {labels__name: casc-managed, organization: 999}
          loop_control:
            loop_var: object_diff_conflicting_params

        - name: Run object_diff with only its projects tasks selected and a conflicting parameter
          ansible.builtin.command: ansible-playbook {{ playbook_dir }}/object_diff_tagged_check.yml --tags projects
          register: object_diff_tagged_run
          changed_when: false
          failed_when: false

        - name: Assert the scope check ran under --tags and stopped the role before the projects fetch
          ansible.builtin.assert:
            that:
              - object_diff_tagged_run.rc != 0
              - object_diff_tagged_run.stdout is search('can only narrow')
              - object_diff_tagged_run.stdout is not search('projects [|] Get the API list')
            fail_msg: "{{ object_diff_tagged_run.stdout_lines[-25:] }}"

    - name: Validate error handling
      block:
        - name: Add Invalid Job Templates to Controller
          ansible.builtin.include_role:
            name: job_templates
          vars:
            controller_templates: "{{ controller_templates_invalid }}"

        - name: Ensure the job_templates_errors is defined and has items
          ansible.builtin.assert:
            that:
              - job_templates_errors is defined
              - job_templates_errors | length > 0
            fail_msg: "No errors found, validate test example"
            success_msg: "Errors found, proceeding"
          vars:
            job_templates_errors: __job_templates_errors_set_stats.ansible_stats.data.job_templates_errors

    - name: Add Controller Settings Individually
      ansible.builtin.include_role:
        name: settings
      vars:
        controller_settings: "{{ controller_settings_individuale }}"

    - name: Run ad hoc commands
      ansible.builtin.include_role:
        name: ad_hoc_command
      when: controller_ad_hoc_commands is defined

    - name: Cancel Ad hoc commands
      ansible.builtin.include_tasks: "./tasks/ad_hoc_cancel.yml"
      when: controller_ad_hoc_commands is defined

    - name: Launch Controller Bulk Hosts
      ansible.builtin.include_role:
        name: bulk_host_create
      vars:
        controller_bulk_hosts: "{{ temp_controller_bulk_hosts }}"
      when:
        - controller_bulk_launch_jobs is defined

    - name: Launch Controller Jobs
      ansible.builtin.include_role:
        name: job_launch
      when: controller_launch_jobs is defined

    - name: Show launched Controller jobs
      ansible.builtin.debug:
        var: launched_controller_jobs

    - name: Combine id output with defaults temp
      ansible.builtin.set_fact:
        tmp_job: "{{ {'id': item.id} }}"
      with_items: "{{ launched_controller_jobs.results }}"
      register: tmp_jobs

    - name: Cancel Controller Jobs
      ansible.builtin.include_role:
        name: jobs_cancel
      vars:
        controller_cancel_jobs: "{{ tmp_jobs.results | map(attribute='ansible_facts.tmp_job') | list }}"
      when: launched_controller_jobs is defined

    - name: Find Job ID's
      ansible.builtin.debug:
        var: __job_templates_job_async_result

    - name: Launch Controller Bulk Jobs
      ansible.builtin.include_role:
        name: bulk_job_launch
      vars:
        controller_bulk_hosts: "{{ temp_controller_bulk_hosts }}"
        controller_bulk_launch_jobs:
          - name: My Bulk Job Launch
            jobs:
              - unified_job_template: "{{ __job_templates_job_async_result.results[0].id }}"
              - unified_job_template: "{{ __job_templates_job_async_result.results[1].id }}"
            organization: Default
            wait: false
      when:
        - controller_bulk_launch_jobs is defined

    - name: Launch Controller workflows
      ansible.builtin.include_role:
        name: workflow_launch
      when: controller_workflow_launch_jobs is defined

    - name: Launched Workflows
      ansible.builtin.debug:
        var: launched_controller_workflows

    - name: Wait for workflow to finish
      job_wait:
        job_id: "{{ launched_controller_workflows.results[0].id }}"
        job_type: workflow_jobs
        timeout: 180
        controller_username:     "{{ controller_username }}"
        controller_password:     "{{ controller_password }}"
        controller_host:         "{{ controller_hostname }}"
        validate_certs:          "{{ controller_validate_certs }}"
      ignore_errors: true  # noqa ignore-errors

    - name: Validate that object_diff fetches stay in the role's organization whatever the extra query parameters say
      vars:
        controller_role_plugin: infra.controller_configuration.controller_object_diff
        controller_configuration_object_diff_secure_logging: false
        orgs: Default
      block:
        - name: Get a token for the object_diff fetches
          ansible.builtin.uri:
            url: "https://{{ controller_hostname }}/api/v2/tokens/"
            user: "{{ controller_username }}"
            password: "{{ controller_password }}"
            method: POST
            force_basic_auth: true
            validate_certs: "{{ controller_validate_certs }}"
            status_code: 201
          register: object_diff_token

        - name: Look up the organizations the test data creates
          ansible.builtin.set_fact:
            object_diff_default_org: "{{ lookup(controller_api_plugin, 'organizations', query_params={'name': 'Default'}, host=controller_hostname,
              oauth_token=object_diff_token.json.token, verify_ssl=controller_validate_certs) }}"
            object_diff_other_org: "{{ lookup(controller_api_plugin, 'organizations', query_params={'name': 'Satellite'}, host=controller_hostname,
              oauth_token=object_diff_token.json.token, verify_ssl=controller_validate_certs) }}"

        # The task files run directly, past the scope check, so only the merge order keeps the fetch in Default.
        - name: Fetch projects with extras that try to move the diff to another organization
          ansible.builtin.include_role:
            name: object_diff
            tasks_from: projects.yml
          vars:
            controller_oauthtoken: "{{ object_diff_token.json.token }}"
            controller_projects: []
            controller_configuration_object_diff_query_params:
              organization: "{{ object_diff_other_org.id }}"

        - name: Assert only projects of the role's organization were fetched
          ansible.builtin.assert:
            that:
              - __controller_api_projects | length > 0
              - __controller_api_projects | map(attribute='organization') | unique == [object_diff_default_org.id]
              - "'Test Inventory source project' not in (__controller_api_projects | map(attribute='name'))"

        - name: Fetch job templates narrowed by label, with extras that also try to move the diff to another organization
          ansible.builtin.include_role:
            name: object_diff
            tasks_from: job_templates.yml
          vars:
            controller_oauthtoken: "{{ object_diff_token.json.token }}"
            controller_templates: []
            controller_configuration_object_diff_query_params:
              labels__name: Prod
              organization: "{{ object_diff_other_org.id }}"

        - name: Assert the label narrowed the job templates and the organization did not change
          ansible.builtin.assert:
            that:
              - "'test-template-1' in (__controller_api_job_templates | map(attribute='name'))"
              - "'Demo Job Template' not in (__controller_api_job_templates | map(attribute='name'))"
              - __controller_api_job_templates | map(attribute='organization') | unique == [object_diff_default_org.id]
      always:
        - name: Delete the object_diff token
          ansible.builtin.uri:
            url: "https://{{ controller_hostname }}{{ object_diff_token.json.url }}"
            user: "{{ controller_username }}"
            password: "{{ controller_password }}"
            method: DELETE
            force_basic_auth: true
            validate_certs: "{{ controller_validate_certs }}"
            status_code: 204
          when: object_diff_token.json is defined
...
