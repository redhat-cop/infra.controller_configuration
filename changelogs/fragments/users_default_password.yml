---
security_fixes:
  - users role - ``controller_user_default_password`` no longer defaults to the literal ``change_me``, which was applied to every entry in ``controller_user_accounts`` that did not set a password of its own. Because ``awx.awx.user`` defaults ``update_secrets`` to ``true``, the value was also written over the password of accounts that already existed, including token-only service accounts intended to have no usable password. The default is now empty.
breaking_changes:
  - users role - an entry in ``controller_user_accounts`` that creates a new account without a ``password`` no longer gets ``change_me``; the controller API rejects it instead. Declare ``password`` on new accounts, or set ``controller_user_default_password`` explicitly to keep the previous behavior.
